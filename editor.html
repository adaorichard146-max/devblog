<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor — DevBlog</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar" id="mainNav">
  <div class="container">
    <div class="navbar-inner">
      <a class="brand" href="index.html"><span class="brand-dot"></span>Dev<em>Blog</em></a>
      <div class="nav-actions"></div>
    </div>
  </div>
</nav>

<div class="container" style="padding:36px 20px 80px;">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px;">
    <h1 style="font-family:var(--font-display);font-size:24px;" id="editorHeading">Novo Post</h1>
    <div style="display:flex;gap:8px;" id="topActions">
      <button class="btn" onclick="savePost('rascunho')">Guardar rascunho</button>
      <button class="btn btn-primary" onclick="savePost('publicado')">Publicar</button>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 290px;gap:24px;" id="editorGrid">

    <!-- CONTEÚDO -->
    <div>
      <div class="form-group">
        <label class="form-label">Título *</label>
        <input type="text" class="form-control" id="fTitle" placeholder="Escreve um título apelativo...">
      </div>
      <div class="form-group">
        <label class="form-label">Resumo <small style="color:var(--hint);font-weight:400;">(aparece nos cards — opcional)</small></label>
        <textarea class="form-control" id="fExcerpt" rows="2" placeholder="Breve descrição do artigo..."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Conteúdo *</label>
        <div class="editor-toolbar">
          <button class="tool-btn" onclick="fmt('bold')"><b>N</b><span class="tooltip">Negrito</span></button>
          <button class="tool-btn" onclick="fmt('italic')"><i>I</i><span class="tooltip">Itálico</span></button>
          <button class="tool-btn" onclick="fmt('underline')"><u>S</u><span class="tooltip">Sublinhado</span></button>
          <div style="width:1px;background:var(--border);margin:0 4px;"></div>
          <button class="tool-btn" onclick="wrapSel('<h2>','</h2>')">H2<span class="tooltip">Título de secção</span></button>
          <button class="tool-btn" onclick="wrapSel('<h3>','</h3>')">H3<span class="tooltip">Subtítulo</span></button>
          <div style="width:1px;background:var(--border);margin:0 4px;"></div>
          <button class="tool-btn" onclick="insertList('ul')">• Lista<span class="tooltip">Lista com marcadores</span></button>
          <button class="tool-btn" onclick="insertList('ol')">1. Lista<span class="tooltip">Lista numerada</span></button>
          <div style="width:1px;background:var(--border);margin:0 4px;"></div>
          <button class="tool-btn" onclick="insertCode()">&lt;/&gt; Código<span class="tooltip">Bloco de código</span></button>
          <button class="tool-btn" onclick="insertQuote()">" Citação<span class="tooltip">Blockquote</span></button>
          <button class="tool-btn" onclick="insertLink()">🔗 Link<span class="tooltip">Inserir link</span></button>
          <div style="width:1px;background:var(--border);margin:0 4px;"></div>
          <button class="tool-btn" id="previewBtn" onclick="togglePreview()">👁 Visualizar post<span class="tooltip">Pré-visualizar o artigo</span></button>
        </div>
        <div class="editor-area">
          <textarea id="fContent"
            placeholder="Escreve o teu artigo aqui de forma simples.&#10;&#10;Podes escrever texto normal — o sistema converte automaticamente em parágrafos.&#10;&#10;Usa as ferramentas acima para formatar: negrito, títulos, listas, código, etc."></textarea>
        </div>
        <div class="editor-area hidden" id="previewPanel">
          <div class="post-body preview-area" id="previewContent"></div>
        </div>
      </div>
    </div>

    <!-- CONFIGURAÇÕES -->
    <div>
      <!-- Imagem de capa -->
      <div class="sidebar-card" style="margin-bottom:16px;">
        <div class="sidebar-title" style="margin-bottom:12px;">Imagem de capa</div>
        <div id="imgUploadArea">
          <label class="upload-zone" id="imgDropZone">
            <input type="file" id="imgFile" accept="image/*" style="display:none;" onchange="handleImageFile(this)">
            <svg width="28" height="28" fill="none" stroke="var(--hint)" stroke-width="1.5" viewBox="0 0 24 24" style="margin:0 auto 8px;display:block;">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21,15 16,10 5,21"/>
            </svg>
            <p>Clica ou arrasta uma imagem</p>
            <p style="font-size:11px;color:var(--hint);margin-top:4px;">JPG, PNG, WebP — máx. 5MB</p>
          </label>
        </div>
        <div id="imgPreviewArea" class="hidden">
          <div class="upload-preview">
            <img id="imgPreviewEl" src="" alt="">
            <div class="upload-actions">
              <button class="upload-remove" onclick="removeImage()">✕ Remover</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Configurações do post -->
      <div class="sidebar-card" style="margin-bottom:16px;">
        <div class="sidebar-title" style="margin-bottom:14px;">Configurações</div>
        <div class="form-group">
          <label class="form-label">Categoria *</label>
          <select class="form-control" id="fCat">
            <option value="">Selecciona uma categoria</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Estado</label>
          <select class="form-control" id="fStatus">
            <option value="rascunho">Rascunho</option>
            <option value="publicado">Publicado</option>
          </select>
        </div>
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;">
          <input type="checkbox" id="fFeatured"> Destacar na homepage
        </label>
      </div>

      <!-- Dicas -->
      <div class="sidebar-card">
        <div class="sidebar-title" style="margin-bottom:10px;">Dicas de escrita</div>
        <div style="font-size:12px;color:var(--muted);line-height:2.1;">
          Selecciona texto + <b>N</b> para negrito<br>
          <b>H2</b> para títulos de secção<br>
          <b>&lt;/&gt;</b> insere bloco de código<br>
          <b>👁 Visualizar</b> para pré-ver<br>
          Texto simples é convertido automaticamente
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/db.js"></script>
<script>
let editId    = null;
let imageData = null;
let previewing = false;

function init() {
  if (!Session.isLoggedIn()) { window.location.href = 'login.html'; return; }
  if (!Session.hasRole('admin', 'escritor')) {
    showToast('Sem permissão para criar posts.', 'error');
    setTimeout(() => window.location.href = 'index.html', 1200);
    return;
  }
  renderNav();

  // Preencher categorias
  Cats.all().forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.id; opt.textContent = c.name;
    document.getElementById('fCat').appendChild(opt);
  });

  // Modo edição
  editId = new URLSearchParams(window.location.search).get('id');
  if (editId) {
    const post = Posts.find(editId);
    if (!post) { showToast('Post não encontrado.', 'error'); return; }
    const user = Session.currentUser();
    if (user.role !== 'admin' && post.authorId !== user.id) {
      showToast('Sem permissão para editar este post.', 'error');
      setTimeout(() => window.location.href = 'index.html', 1200);
      return;
    }
    document.getElementById('editorHeading').textContent = 'Editar Post';
    document.getElementById('fTitle').value    = post.title;
    document.getElementById('fExcerpt').value  = post.excerpt || '';
    document.getElementById('fContent').value  = post.content
      .replace(/<\/p>\s*<p>/gi, '\n\n')
      .replace(/<p>/gi, '').replace(/<\/p>/gi, '')
      .replace(/<br\s*\/?>/gi, '\n');
    document.getElementById('fStatus').value   = post.status;
    document.getElementById('fCat').value      = post.catId;
    document.getElementById('fFeatured').checked = post.featured;
    if (post.image) { imageData = post.image; showImagePreview(post.image); }
    document.getElementById('topActions').innerHTML = `
      <a href="post.html?id=${editId}" class="btn btn-sm">← Ver post</a>
      <button class="btn" onclick="savePost(document.getElementById('fStatus').value)">Guardar alterações</button>
      <button class="btn btn-primary" onclick="savePost('publicado')">Publicar</button>`;
  }

  // Drag & drop
  const zone = document.getElementById('imgDropZone');
  zone.addEventListener('dragover',  e => { e.preventDefault(); zone.classList.add('drag'); });
  zone.addEventListener('dragleave', ()  => zone.classList.remove('drag'));
  zone.addEventListener('drop',      e  => {
    e.preventDefault(); zone.classList.remove('drag');
    const f = e.dataTransfer.files[0];
    if (f && f.type.startsWith('image/')) processImage(f);
  });
}

// ── IMAGEM ──
async function handleImageFile(input) {
  const f = input.files[0];
  if (!f) return;
  if (f.size > 5 * 1024 * 1024) { showToast('Imagem demasiado grande (máx. 5MB).', 'error'); return; }
  await processImage(f);
}

async function processImage(file) {
  showToast('A processar imagem...', 'info');
  try {
    imageData = await ImgUtil.post(file);
    showImagePreview(imageData);
    showToast('Imagem carregada!', 'success');
  } catch {
    showToast('Erro ao processar imagem.', 'error');
  }
}

function showImagePreview(src) {
  document.getElementById('imgPreviewEl').src = src;
  document.getElementById('imgUploadArea').classList.add('hidden');
  document.getElementById('imgPreviewArea').classList.remove('hidden');
}

function removeImage() {
  imageData = null;
  document.getElementById('imgFile').value = '';
  document.getElementById('imgUploadArea').classList.remove('hidden');
  document.getElementById('imgPreviewArea').classList.add('hidden');
}

// ── FERRAMENTAS DO EDITOR ──
function getTextarea() { return document.getElementById('fContent'); }

function fmt(cmd) {
  const ta = getTextarea();
  const s = ta.selectionStart, e = ta.selectionEnd;
  if (s === e) { showToast('Selecciona texto primeiro.', 'info'); return; }
  const sel = ta.value.substring(s, e);
  const map = { bold: ['<strong>', '</strong>'], italic: ['<em>', '</em>'], underline: ['<u>', '</u>'] };
  const [o, c] = map[cmd];
  insertAt(ta, s, e, o + sel + c);
}

function wrapSel(open, close) {
  const ta = getTextarea();
  const s = ta.selectionStart, e = ta.selectionEnd;
  const sel = ta.value.substring(s, e) || 'Texto aqui';
  insertAt(ta, s, e, `\n${open}${sel}${close}\n`);
}

function insertList(type) {
  const ta = getTextarea(), pos = ta.selectionEnd;
  const s = `\n<${type}>\n  <li>Item 1</li>\n  <li>Item 2</li>\n  <li>Item 3</li>\n</${type}>\n`;
  insertAt(ta, pos, pos, s);
}

function insertCode() {
  const ta = getTextarea();
  const s = ta.selectionStart, e = ta.selectionEnd;
  const sel = ta.value.substring(s, e);
  if (sel && !sel.includes('\n')) {
    insertAt(ta, s, e, `<code>${sel}</code>`);
  } else {
    insertAt(ta, s, e, `\n<pre><code>${sel || '// código aqui'}</code></pre>\n`);
  }
}

function insertQuote() {
  const ta = getTextarea();
  const s = ta.selectionStart, e = ta.selectionEnd;
  const sel = ta.value.substring(s, e) || 'Escreve a citação aqui...';
  insertAt(ta, s, e, `\n<blockquote>${sel}</blockquote>\n`);
}

function insertLink() {
  const url = prompt('URL do link:', 'https://');
  if (!url) return;
  const ta = getTextarea();
  const s = ta.selectionStart, e = ta.selectionEnd;
  const label = ta.value.substring(s, e) || url;
  insertAt(ta, s, e, `<a href="${url}" target="_blank" rel="noopener">${label}</a>`);
}

function insertAt(ta, s, e, text) {
  ta.value = ta.value.substring(0, s) + text + ta.value.substring(e);
  ta.selectionStart = ta.selectionEnd = s + text.length;
  ta.focus();
}

// ── PREVIEW ──
function togglePreview() {
  previewing = !previewing;
  const ta      = getTextarea();
  const panel   = document.getElementById('previewPanel');
  const content = document.getElementById('previewContent');
  const btn     = document.getElementById('previewBtn');
  if (previewing) {
    content.innerHTML = textToHtml(ta.value) || '<p style="color:var(--muted)">Sem conteúdo ainda.</p>';
    ta.closest('.editor-area').classList.add('hidden');
    panel.classList.remove('hidden');
    btn.style.cssText = 'background:var(--accent-lt);border-color:var(--accent);color:var(--accent)';
  } else {
    ta.closest('.editor-area').classList.remove('hidden');
    panel.classList.add('hidden');
    btn.style.cssText = '';
  }
}

// ── GUARDAR ──
function savePost(statusOverride) {
  const title    = document.getElementById('fTitle').value.trim();
  const content  = document.getElementById('fContent').value.trim();
  const catId    = document.getElementById('fCat').value;
  const excerpt  = document.getElementById('fExcerpt').value.trim();
  const featured = document.getElementById('fFeatured').checked;
  const status   = statusOverride || document.getElementById('fStatus').value;

  if (!title)   { showToast('O título é obrigatório.', 'error'); return; }
  if (!content) { showToast('O conteúdo é obrigatório.', 'error'); return; }
  if (!catId)   { showToast('Selecciona uma categoria.', 'error'); return; }

  const data = { title, content, catId, status, featured, image: imageData || null };
  if (excerpt) data.excerpt = excerpt;

  if (editId) {
    Posts.update(editId, data);
    showToast('Post actualizado!', 'success');
    setTimeout(() => window.location.href = `post.html?id=${editId}`, 800);
  } else {
    const post = Posts.create(data);
    showToast(status === 'publicado' ? 'Post publicado!' : 'Rascunho guardado!', 'success');
    setTimeout(() => window.location.href =
      status === 'publicado' ? `post.html?id=${post.id}` : 'index.html', 800);
  }
}

init();
</script>
</body>
</html>
