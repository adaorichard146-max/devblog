<!DOCTYPE html>
<html lang="pt">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Registar — DevBlog</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page">
<div class="auth-card">
  <a href="index.html" class="auth-logo">Dev<em>Blog</em></a>
  <p class="auth-sub">Cria a tua conta grátis</p>
  <h2 class="auth-title">Junta-te ao DevBlog</h2>
  <div class="alert alert-error"   id="errMsg"></div>
  <div class="alert alert-success" id="okMsg"></div>
  <div class="form-group"><label class="form-label">Nome completo</label><input type="text" class="form-control" id="fName" placeholder="O teu nome"></div>
  <div class="form-group"><label class="form-label">Email</label><input type="email" class="form-control" id="fEmail" placeholder="o.teu@email.com"></div>
  <div class="form-group"><label class="form-label">Password</label><input type="password" class="form-control" id="fPass" placeholder="Mínimo 6 caracteres"></div>
  <div class="form-group"><label class="form-label">Confirmar password</label><input type="password" class="form-control" id="fPass2" placeholder="Repete a password"></div>
  <button class="btn btn-primary btn-full" onclick="doRegister()">Criar conta</button>
  <div class="auth-footer" style="margin-top:18px;">Já tens conta? <a href="login.html">Entrar</a></div>
</div>
<script src="js/db.js"></script>
<script>
function doRegister() {
  const name  = document.getElementById('fName').value.trim();
  const email = document.getElementById('fEmail').value.trim();
  const pass  = document.getElementById('fPass').value;
  const pass2 = document.getElementById('fPass2').value;
  const err   = document.getElementById('errMsg');
  const ok    = document.getElementById('okMsg');
  err.classList.remove('show'); ok.classList.remove('show');
  if (pass.length < 6) { err.textContent = 'Password com pelo menos 6 caracteres.'; err.classList.add('show'); return; }
  if (pass !== pass2)  { err.textContent = 'As passwords não coincidem.';           err.classList.add('show'); return; }
  const result = Users.register(name, email, pass);
  if (!result.ok) { err.textContent = result.error; err.classList.add('show'); return; }
  ok.textContent = 'Conta criada com sucesso! A redirecionar para o login...';
  ok.classList.add('show');
  setTimeout(() => window.location.href = 'login.html', 1500);
}
</script>
</body>
</html>
