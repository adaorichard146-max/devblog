<!DOCTYPE html>
<html lang="pt">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Entrar — DevBlog</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page">
<div class="auth-card">
  <a href="index.html" class="auth-logo">Dev<em>Blog</em></a>
  <p class="auth-sub">Entra na tua conta</p>
  <h2 class="auth-title">Bem-vindo de volta</h2>
  <div class="alert alert-error" id="errMsg"></div>
  <div class="alert alert-info show" style="font-size:12px;line-height:1.9;">

  </div>
  <div class="form-group"><label class="form-label">Email</label><input type="email" class="form-control" id="fEmail" placeholder="o.teu@email.com" autocomplete="email"></div>
  <div class="form-group"><label class="form-label">Password</label><input type="password" class="form-control" id="fPass" placeholder="••••••••" autocomplete="current-password"></div>
  <button class="btn btn-primary btn-full" onclick="doLogin()">Entrar</button>
  <div class="auth-footer" style="margin-top:18px;">Não tens conta? <a href="register.html">Registar grátis</a></div>
</div>
<script src="js/db.js"></script>
<script>
if (Session.isLoggedIn()) window.location.href = 'index.html';
document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
function doLogin() {
  const email = document.getElementById('fEmail').value.trim();
  const pass  = document.getElementById('fPass').value;
  const err   = document.getElementById('errMsg');
  err.classList.remove('show');
  if (!email || !pass) { err.textContent = 'Preenche todos os campos.'; err.classList.add('show'); return; }
  const result = Users.login(email, pass);
  if (!result.ok) { err.textContent = result.error; err.classList.add('show'); return; }
  showToast(`Bem-vindo, ${result.user.name.split(' ')[0]}!`, 'success');
  setTimeout(() => window.location.href = 'index.html', 700);
}
</script>
</body>
</html>
